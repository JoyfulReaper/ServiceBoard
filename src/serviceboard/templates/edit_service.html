{% extends "base.html" %}

{% block title %}Edit {{ service["name"] }} | ServiceBoard{% endblock %}

{% block content %}

<section class="page-intro">
    <p class="eyebrow">Administration</p>
    <h1>Edit {{ service["name"] }}</h1>
    <p class="intro-text">
        Update the details and visibility of this service.
    </p>
</section>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form class="service-form" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="name">Service Name:</label>
            <input type="text" id="name" name="name"
                   value="{{ service['name'] }}" required>
        </div>

        <div>
            <label for="url">URL:</label>
            <input type="url" id="url" name="url"
                   value="{{ service['url'] }}" required>
        </div>

        <div class="form-full-width">
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="3">{{ service["description"] or "" }}</textarea>
        </div>

        <div>
            <label for="host">VPS / Host:</label>
            <input type="text" id="host" name="host"
                   value="{{ service['host'] or '' }}">
        </div>

        <div>
            <label for="deployment_type">Deployment Type:</label>
            <input type="text" id="deployment_type" name="deployment_type"
                   list="deployment-types"
                   value="{{ service['deployment_type'] or '' }}">

            <datalist id="deployment-types">
                <option value="docker"></option>
                <option value="systemd"></option>
                <option value="manual"></option>
                <option value="other"></option>
            </datalist>
        </div>

        <div>
            <label for="runtime_name">Runtime:</label>
            <input type="text" id="runtime_name" name="runtime_name"
                   value="{{ service['runtime_name'] or '' }}">
        </div>

        <div>
            <label for="runtime_version">Runtime Version:</label>
            <input type="text" id="runtime_version" name="runtime_version"
                   value="{{ service['runtime_version'] or '' }}">
        </div>

        <div class="form-full-width">
            <label for="is_public">
                <input type="checkbox" id="is_public" name="is_public"
                       {% if form_is_public|default(service["is_public"]) %}checked{% endif %}>
                Show publicly
            </label>
        </div>

        <button type="submit">Save Changes</button>
    </form>
<p>
    <a href="{{ url_for('admin') }}">← Back to administration</a>
</p>

{% endblock %}
